<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shop Elegance : Contact Us</title>

        <!-- favicon -->
        <link rel="apple-touch-icon" sizes="180x180"
            href="./assets/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32"
            href="./assets/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16"
            href="./assets/favicon-16x16.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <!-- font awesome -->
        <link rel="preload"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/webfonts/fa-solid-900.woff2"
            as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            media="print" onload="this.media='all'" />
        <noscript>
            <link rel="stylesheet"
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
        </noscript>

        <!-- Bootstrap CSS -->
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            crossorigin="anonymous" />

        <!-- kursor css  -->
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/kursor/dist/kursor.css"
            media="print"
            onload="this.media='all'" />
        <noscript>
            <link rel="stylesheet"
                href="https://cdn.jsdelivr.net/npm/kursor/dist/kursor.css" />
        </noscript>

        <!-- custom css -->
        <link rel="stylesheet" href="../src/css/main.css">
        <link rel="stylesheet" href="../src/css/responsive.css">
    </head>

    <body>
        <div class="design-main-wrapper">
            <button onclick="topFunction()" id="scrollToTop" title="Go to top">
                <i class="fa-solid fa-angle-up"></i>
            </button>
            <div id="header"></div>
            <main>
                <div class="section">
                    <div class="container">
                        <div class=" breadcrumbs py-5">
                            <a href="../index.html"
                                class="text-body-secondary ">Home</a> <span
                                class="px-2 text-secondary">/</span>
                            <a href="#" class="text-dark fw-bold">Contact</a>
                        </div>

                        <div
                            class="row justify-content-around align-items-center   py-4  row-gap-5">
                            <div
                                class="col-lg-5 col-sm-10 col-12 contact-info py-5 px-4 rounded-4   d-flex flex-column shadow-lg row-gap-4 ">
                                <div
                                    class="call-us d-flex flex-column row-gap-3 border-bottom border-secondary-subtle pb-4">
                                    <div
                                        class="d-flex gap-2 align-items-center">
                                        <img
                                            src="./assets/images/icons-phone.svg"
                                            alt="icon-phone"> <span
                                            class="fw-bold fs-5">Call to
                                            Us</span> </div>
                                    <p>We are available 24/7, 7 days a week.</p>
                                    <p>Phone: <a href="tel:+911611112222"
                                            class="text-decoration-none text-dark">+911611112222</a></p>
                                </div>
                                <div
                                    class="write-us d-flex flex-column row-gap-3">
                                    <div
                                        class="d-flex gap-2 align-items-center">
                                        <img
                                            src="./assets/images/icons-mail.svg"
                                            alt="icon-email"> <span
                                            class="fw-bold fs-5">Write To
                                            US</span>
                                    </div>
                                    <p>Fill out our form and we will contact you
                                        within 24 hours.</p>
                                    <p>Emails: <a
                                            href="mailto:customer@exclusive.com"
                                            class="text-decoration-none text-dark">customer@exclusive.com</a></p>
                                    <p>Emails: <a
                                            href="mailto:support@exclusive.com"
                                            class="text-decoration-none text-dark">support@exclusive.com</a></p>
                                </div>
                            </div>
                            <div
                                class="col-lg-5 col-sm-10 col-12 contact-form shadow-lg py-5 px-4 rounded-4 ">
                                <form action="#"
                                    class="d-flex flex-column row-gap-4  align-items-lg-start ">
                                    <div
                                        class="mb-3 d-flex gap-2 flex-lg-row flex-column row-gap-2">
                                        <input type="text"
                                            class="form-control py-2"
                                            placeholder="Your Name" required>
                                        <input type="email"
                                            class="form-control py-2"
                                            placeholder="Your Email" required>
                                        <input type="text"
                                            class="form-control py-2"
                                            placeholder="Phone Number" required>
                                    </div>

                                    <div class="mb-3 w-100">
                                        <textarea class="form-control py-3"
                                            rows="5" placeholder="Your Message"
                                            required></textarea>
                                    </div>
                                    <button type="submit"
                                        class="btn theme-btn   py-3 px-5 fw-bold">Send
                                        Message</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
            <div id="footer"></div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../src/Js/components.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/kursor" defer></script>
        <script src="../src/Js/main.js"></script>
    </body>

</html>
