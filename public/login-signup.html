<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Elegance : Login-Signup</title>


    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />


    <!-- font awesome -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/webfonts/fa-solid-900.woff2"
        as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        media="print" onload="this.media='all'" />
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    </noscript>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous" />

    <!-- kursor css  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/kursor/dist/kursor.css" media="print"
        onload="this.media='all'" />
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/kursor/dist/kursor.css" />
    </noscript>

    <!-- custom css -->
    <link rel="stylesheet" href="../src/css/main.css">

    <style>
        .theme-color {
            color: #DB4444;
            /* text-shadow:  4px 2px 4px #ffffff91; */
        }

        .theme-btn {
            background-color: #DB4444;
            border: 1px solid #DB4444 !important;
            transition: all 0.4s ease-in-out;

            &:hover {
                background-color: #fff;
                color: #DB4444 !important;
                box-shadow: 0 0 10px #ffffff59;
            }
        }

        .custom-form {

            width: 300px;
        }
    </style>
    <link rel="stylesheet" href="../src/css/responsive.css">
</head>

<body>
    <div class="design-main-wrapper">
        <button onclick="topFunction()" id="scrollToTop" title="Go to top">
            <i class="fa-solid fa-angle-up"></i>
        </button>
        <div id="header"></div>
        <main>
            <div class="login-signup-section py-5 section">
                <div class="container">
                    <div
                        class="login-signup-wrapper d-flex justify-content-around align-items-md-center flex-md-row flex-column row-gap-5 py-3">
                        <div class="login-banner">
                            <img src="./assets/images/login-banner-img.svg" alt="login-banner-image"
                                class="img-fluid rounded-4" width="400">
                        </div>

                        <div id="signupForm" class="signup-form">
                            <h3 class="fs-2 fw-bold mb-3 theme-color">Create an Account</h3>
                            <form action="#" class="custom-form">

                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="floatingInput1" placeholder="Your Name"
                                        autocomplete="name">
                                    <label for="floatingInput1">Name</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="floatingInput2"
                                        placeholder="name@example.com" autocomplete="email">
                                    <label for="floatingInput2">Email address</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <input type="tel" class="form-control" id="floatingInput3"
                                        placeholder="Enter your phone number" pattern="[0-9+\-\s()]{10,15}"
                                        onkeydown="return /[0-9+\-\s()]/.test(event.key) || ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(event.key)"
                                        oninput="this.value = this.value.replace(/[^0-9+\-\s()]/g, '').slice(0, 15)"
                                        autocomplete="tel" required>
                                    <label for="floatingInput3">Phone Number</label>
                                </div>
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="floatingPassword2"
                                        placeholder="Password" autocomplete="new-password">
                                    <label for="floatingPassword2">Password</label>
                                </div>

                                <div class="login-signup-buttons mt-3 d-flex flex-column align-items-center gap-3 ">
                                    <button type="submit"
                                        class="btn theme-btn  w-100 text-center  px-5 py-2 text-white ">Create
                                        Account</button>
                                    <button type="submit"
                                        class="btn login-btn btn-primary w-100 d-flex gap-2 px-5 py-2 justify-content-center"><img
                                            src="./assets/images/Icon-Google.svg" alt="" height="24" width="24"> Sign Up
                                        with Google</button>

                                    <p>Already have account? <button onclick="toggleLogin()"
                                            class="border-0 bg-transparent text-danger">Login</p>
                                </div>

                            </form>


                        </div>

                        <div id="loginForm" class="login-form d-none">
                            <h3 class="fs-2 fw-bold mb-4 theme-color">Hey Welcome back! </h3>
                            <form class="custom-form d-flex flex-column row-gap-2" action="#">
                                <div class="form-floating ">
                                    <input type="text" class="form-control" id="floatingInput4" placeholder="Your Name"
                                        autocomplete="name">
                                    <label for="floatingInput4">Name</label>
                                </div>
                                <p class="text-center fw-bold my-2">or</p>

                                <div class="form-floating mb-3">
                                    <input type="tel" class="form-control" id="floatingInput5"
                                        placeholder="Enter your phone number" pattern="[0-9+\-\s()]{10,15}"
                                        onkeydown="return /[0-9+\-\s()]/.test(event.key) || ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(event.key)"
                                        oninput="this.value = this.value.replace(/[^0-9+\-\s()]/g, '').slice(0, 15)"
                                        autocomplete="tel" required>
                                    <label for="floatingInput5">Phone Number</label>
                                </div>
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="floatingPassword"
                                        placeholder="Password" autocomplete="current-password">
                                    <label for="floatingPassword">Password</label>
                                </div>

                                <div class="login-signup-buttons mt-4 d-flex align-items-center gap-3 flex-column">
                                    <button type="submit"
                                        class="btn login-btn  w-100 text-white  px-5 py-2 theme-btn text-center fw-bold">Login
                                    </button>
                                    <button type="submit"
                                        class="btn login-btn btn-primary w-100 d-flex gap-2 px-5 py-2 justify-content-center fw-bold"><img
                                            src="./assets/images/Icon-Google.svg" alt="" height="24" width="24">Login
                                        with Google</button>

                                    <p>Don't have account? <button onclick="toggleLogin()"
                                            class="border-0 bg-transparent text-danger">Signup</p>
                                </div>

                            </form>


                        </div>
                    </div>

                </div>
            </div>
        </main>
        <div id="footer"></div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../src/Js/components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/kursor" defer></script>
    <script src="../src/Js/main.js"></script>
</body>

</html>
